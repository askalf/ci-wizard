name: Publish to npm
# Runs only when a GitHub release is published. Auth is npm trusted publishing (OIDC): the
# npmjs.com trusted publisher for ci-wizard is bound to this repository and this filename
# (publish.yml), so no npm token is stored anywhere. Provenance comes with OIDC publishing, and
# the packed tarball gets a GitHub build attestation too.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # Off until the npmjs.com trusted publisher exists: set the repository variable NPM_PUBLISH to
    # true once it does. Without the gate every release would end in a failed publish run.
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing and for the attestation
      attestations: write # the build attestation of the tarball
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or later; Node 24 ships npm 11. The package's
          # own floor stays engines.node >= 20, which ci.yml tests.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: The release tag names package.json's version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match package.json version $version (expected v$version)"
            exit 1
          fi
          if [ "$(npm view "ci-wizard@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "npm already has ci-wizard@$version; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci --no-audit --no-fund
        if: steps.version.outputs.skip != 'true'
      - run: npm test
        if: steps.version.outputs.skip != 'true'
      - name: dist/ is what src/ builds to
        if: steps.version.outputs.skip != 'true'
        run: |
          npm run build
          git diff --exit-code -- dist/

      - name: Pack
        id: pack
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          tarball=$(npm pack --silent)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          sha256sum "$tarball"

      - name: Attest the tarball
        if: steps.version.outputs.skip != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        # No NODE_AUTH_TOKEN: npm exchanges the job's OIDC token for a short-lived publish token.
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public
