name: Auto release on version bump
# The version bump on main IS the release, as in askalf/dario: merge a pull request that moves
# package.json's version and this workflow tags that commit, cuts the GitHub release with the
# version's CHANGELOG.md section as its notes, attaches the attested npm tarball, and publishes it
# to npm. Nobody tags or drafts anything by hand.
#
# It is idempotent: each run checks what has already shipped for the version in package.json
# (the GitHub release, the npm version) and fills only the gaps, so a push that leaves the version
# alone does nothing, and the hourly run finishes a release whose first run failed part-way.
#
# Auth for npm is trusted publishing (OIDC): the npmjs.com trusted publisher for ci-wizard is
# bound to this repository and this filename (publish.yml), so the file keeps its name and no npm
# token is stored anywhere. The npm half stays off until the repository variable NPM_PUBLISH is
# true (CONTRIBUTING.md, Releases); until then a release is the GitHub release and its tarball.
#
# A release created with the job's GITHUB_TOKEN starts no other workflow, which is why the npm
# publish runs here, in the same job, and not in a workflow on the release event.

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'askalf/ci-wizard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: auto-release-main
      cancel-in-progress: false
    permissions:
      contents: write # the tag, the release and its assets
      id-token: write # OIDC for npm trusted publishing and for the attestation
      attestations: write # the build attestation of the tarball
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Enough history to find the commit that bumped the version, for the release body.
          fetch-depth: 50
          persist-credentials: false # no git push here (gh and OIDC only)

      - name: Read package.json version
        id: ver
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing to release: package.json version '$version' is not X.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Idempotency gate (GitHub release, npm)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
        run: |
          set -euo pipefail
          gh_exists=false
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh_exists=true; fi
          npm_wanted=false
          npm_exists=false
          if [ "$NPM_PUBLISH" = true ]; then
            npm_wanted=true
            if [ "$(npm view "ci-wizard@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then npm_exists=true; fi
          fi
          {
            echo "gh_release_exists=$gh_exists"
            echo "npm_wanted=$npm_wanted"
            echo "npm_published=$npm_exists"
          } >> "$GITHUB_OUTPUT"
          if [ "$gh_exists" = true ] && { [ "$npm_wanted" = false ] || [ "$npm_exists" = true ]; }; then
            echo "v$VERSION is fully shipped (release=$gh_exists, npm wanted=$npm_wanted, npm=$npm_exists); nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION is incomplete (release=$gh_exists, npm wanted=$npm_wanted, npm=$npm_exists); filling the gaps."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.proceed == 'true'
        with:
          # Trusted publishing needs npm 11.5.1 or later; Node 24 ships npm 11. The package's own
          # floor stays engines.node >= 20, which ci.yml tests.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
        if: steps.gate.outputs.proceed == 'true'
      - run: npm test
        if: steps.gate.outputs.proceed == 'true'
      - name: dist/ is what src/ builds to
        if: steps.gate.outputs.proceed == 'true'
        run: |
          npm run build
          git diff --exit-code -- dist/
      - name: --version smoke
        if: steps.gate.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: test "$(node bin/ci-wizard.mjs --version)" = "$VERSION"

      - name: Pack
        id: pack
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          tarball=$(npm pack --silent)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          sha256sum "$tarball"
      - name: Attest the tarball (keyless Sigstore)
        id: attest
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Release notes from CHANGELOG.md
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.gh_release_exists != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$VERSION" > notes.md
          # A zero exit is not enough: a script that silently skips its main block also exits 0.
          if ! [ -s notes.md ]; then
            echo "::error::release notes for $VERSION are empty"
            exit 1
          fi
          # Name the pull request that bumped the version: the newest commit whose package.json
          # carries it while its parent's does not, read off the squash subject's (#N).
          pr=""
          for c in $(git log --format=%H -n 50 -- package.json); do
            at=$(git show "$c:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true)
            before=$(git show "$c^:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true)
            if [ "$at" = "$VERSION" ] && [ "$before" != "$VERSION" ]; then
              pr=$(git log -1 --format=%s "$c" | sed -nE 's/.*\(#([0-9]+)\)$/\1/p')
              break
            fi
          done
          {
            if [ -n "$pr" ]; then
              echo "Auto-released from the merge of #$pr (trigger: $TRIGGER)."
            else
              echo "Auto-released from main (trigger: $TRIGGER)."
            fi
            echo
            cat notes.md
            echo
            echo "---"
            echo
            echo "Built, tested and packed by \`publish.yml\` on this run; the tarball attached here carries a keyless Sigstore build attestation (\`gh attestation verify <tarball> --owner askalf\`)."
          } > body.md
          cat body.md

      - name: Create the GitHub release
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.gh_release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # The tag lands on the commit this run built and tested; gh creates it when it is missing.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file body.md

      - name: Attach the attested tarball
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "$TARBALL.sigstore.json"
          # Scorecard credits provenance only to *.intoto.jsonl assets: one DSSE envelope per line,
          # taken from the Sigstore bundle.
          jq -ec '.dsseEnvelope' "$BUNDLE" > "$TARBALL.intoto.jsonl"
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            "$TARBALL" "$TARBALL.sigstore.json" "$TARBALL.intoto.jsonl"

      - name: npm publish (OIDC trusted publishing)
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.npm_wanted == 'true' && steps.gate.outputs.npm_published != 'true'
        # No NODE_AUTH_TOKEN: npm exchanges the job's OIDC token for a short-lived publish token.
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          if out="$(npm publish "./$TARBALL" --provenance --access public 2>&1)"; then
            printf '%s\n' "$out"
          else
            printf '%s\n' "$out"
            # A run racing another, or a retry after a publish that landed: npm already has it.
            if printf '%s\n' "$out" | grep -qiE '^npm (error|ERR!).*(E409|cannot publish over|previously staged)'; then
              echo "::notice::npm already has this version (E409); treated as published."
            else
              exit 1
            fi
          fi

      - name: Summary
        if: steps.gate.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          NPM: ${{ steps.gate.outputs.npm_wanted }}
        run: |
          {
            echo "Released v$VERSION: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
            if [ "$NPM" = true ]; then echo "Published to npm with provenance."; else echo "npm publish is off (NPM_PUBLISH is not true)."; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
